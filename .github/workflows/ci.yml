name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Get dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Generate code (quiz_core)
        working-directory: packages/quiz_core
        run: dart run build_runner build -d

      - name: Generate code (app)
        working-directory: app
        run: dart run build_runner build -d

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test quiz_core
        working-directory: packages/quiz_core
        run: dart test

      - name: Test server against disposable PostgreSQL
        run: scripts/test/server.sh

      - name: Test app
        working-directory: app
        run: flutter test

  docker:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and start db + server
        run: docker compose up -d --build --wait

      - name: Check health endpoint
        run: curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8080/api/v1/health

      - name: Check database login
        run: docker compose exec -T db psql -U studybetter -d studybetter -tAc 'select 1'

      - name: Show logs
        if: always()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v

  windows-integration:
    name: Windows study flows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: dart pub get
      - run: dart run build_runner build
        working-directory: packages/quiz_core
      - run: dart run build_runner build
        working-directory: app
      - run: flutter test integration_test -d windows
        working-directory: app
      # Pushes to main are packaged by release.yml; PRs get a test build here.
      - name: Build Windows
        if: github.event_name == 'pull_request'
        run: flutter build windows --release
        working-directory: app
      - name: Package Windows build
        if: github.event_name == 'pull_request'
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath StudyBetter-windows-pr.zip
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: StudyBetter-windows-pr-${{ github.event.pull_request.number }}
          path: StudyBetter-windows-pr.zip
          retention-days: 14

  android-build:
    name: Android debug build
    # Pushes to main are built and signed by release.yml. PR builds use debug
    # signing so they work without the release secrets (including fork PRs).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: dart pub get
      - run: dart run build_runner build
        working-directory: packages/quiz_core
      - run: dart run build_runner build
        working-directory: app
      - run: flutter build apk --debug
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: StudyBetter-android-pr-${{ github.event.pull_request.number }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
