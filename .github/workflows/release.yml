name: Release builds
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart run build_runner build
        working-directory: packages/quiz_core
      - run: dart run build_runner build
        working-directory: app
      - run: flutter test integration_test -d windows
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      - run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath StudyBetter-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StudyBetter-windows
          path: StudyBetter-windows.zip
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Require release signing secrets
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD" || { echo 'Configure the four ANDROID_KEYSTORE/KEY secrets documented in docs/releases.md'; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/studybetter.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/studybetter.jks" >> "$GITHUB_ENV"
      - run: dart pub get
      - run: dart run build_runner build
        working-directory: packages/quiz_core
      - run: dart run build_runner build
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - run: flutter build appbundle --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: StudyBetter-android
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/studybetter.jks"
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach builds to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          find artifacts -type f \( -name '*.zip' -o -name '*.apk' -o -name '*.aab' \) -exec gh release upload "$GITHUB_REF_NAME" {} --clobber \;
